<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" width="150" height="100">
  <!-- 크리티컬 아츠(CA): 체력이 적을 때 SA3 대신 나가는 기술. SA(주황)와 같은 판 모양에, 강화된 느낌으로 진한 빨강 + 금색 이중 테두리 -->
  <defs>
    <linearGradient id="ca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>
  <rect x="2.5" y="2.5" width="145" height="95" rx="14" fill="url(#ca)" stroke="#FBBF24" stroke-width="5"/>
  <rect x="9" y="9" width="132" height="82" rx="9" fill="none" stroke="#FDE68A" stroke-opacity="0.55" stroke-width="2"/>
  <text x="75" y="76" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="66" letter-spacing="2">CA</text>
</svg>
