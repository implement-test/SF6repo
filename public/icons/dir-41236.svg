<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!-- 반원 앞(41236). 원본 방향키 아이콘(dir-236.webp)의 모양·색을 따라 그렸다: 왼쪽(4)에서 아래(2)를 돌아 오른쪽(6)으로.
       63214 는 좌우 반전해서 쓴다. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f4f4f"/>
      <stop offset="0.55" stop-color="#383838"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="arrow" x1="4" y1="0" x2="34" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8321c"/>
      <stop offset="0.55" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </linearGradient>
  </defs>
  <!-- 테두리(밝은 테) + 안쪽 판 -->
  <path d="M12.3 1.7h11.4a1.6 1.6 0 0 1 1.6 1.6v9.4h7.4a1.6 1.6 0 0 1 1.6 1.6v7.4a1.6 1.6 0 0 1-1.6 1.6h-7.4v9.4a1.6 1.6 0 0 1-1.6 1.6h-11.4a1.6 1.6 0 0 1-1.6-1.6v-9.4h-7.4a1.6 1.6 0 0 1-1.6-1.6v-7.4a1.6 1.6 0 0 1 1.6-1.6h7.4v-9.4a1.6 1.6 0 0 1 1.6-1.6z"
        fill="url(#pad)" stroke="url(#rim)" stroke-width="1.1"/>
  <!-- 반원 화살표: 어두운 테두리 → 색 띠 → 안쪽 하이라이트 (원본 236 처럼 판 아래쪽 안에서 돈다) -->
  <path d="M7.4 16.4C7.6 31.2 28.6 31.2 28.8 19.8" fill="none" stroke="#4a1400" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/>
  <path d="M7.4 16.4C7.6 31.2 28.6 31.2 28.8 19.8" fill="none" stroke="url(#arrow)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M28.8 10.4L24.6 17.4h8.4z" fill="url(#arrow)" stroke="#4a1400" stroke-opacity="0.85" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M10 22.8C12.6 27.6 23.8 27.6 26.4 22.8" fill="none" stroke="#ffd27a" stroke-width="0.7" stroke-linecap="round" opacity="0.65"/>
